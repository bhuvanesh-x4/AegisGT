name: Build AegisGT iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Compile iOS Application (macOS Runner)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor iOS Platform
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods Native Dependencies
        working-directory: frontend/ios/App
        run: pod install --repo-update

      - name: Build Xcode Workspace
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App into IPA Archive
        run: |
          mkdir -p frontend/ios/build/Payload
          cp -r frontend/ios/build/Build/Products/Release-iphoneos/App.app frontend/ios/build/Payload/
          cd frontend/ios/build
          zip -r AegisGT-iOS.ipa Payload
          ls -lh AegisGT-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisGT-iOS-App
          path: frontend/ios/build/AegisGT-iOS.ipa
          retention-days: 30
